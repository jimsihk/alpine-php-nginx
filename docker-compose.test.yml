services:
  app:
    image: ${TEST_IMAGE_NAME:-jimsihk/alpine-php-nginx:local}
    build: .
    environment:
      - custom_router=/r.php
    volumes:
      - "./tests/nginx-pre-php.conf:/etc/nginx/conf.d/default/server/pre-php/test.conf:ro"
  sut:
    image: ${TEST_IMAGE_NAME:-jimsihk/alpine-php-nginx:local}
    depends_on:
      - app
    command: /tmp/run_tests.sh
    volumes:
      - "./run_tests.sh:/tmp/run_tests.sh:ro"