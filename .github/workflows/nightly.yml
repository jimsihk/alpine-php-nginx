name: Nightly Build

on:
  schedule:
    - cron: '00 17 * * *' #UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ${{ vars.REGISTRY_NIGHTLY }}
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: nightly
  RETRY_PR_BRANCH_PREFIX: renovate

jobs:
  build-container:
    permissions:
      contents: read # for actions/checkout to fetch code
      packages: write # for docker/build-push-action to store image to package
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to the Nightly Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test
        run: |
          export TEST_IMAGE_NAME=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10 --build

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  scan-nightly-build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    uses: ./.github/workflows/scan.yml
    needs: [build-container]
    with:
      image: ${{ vars.REGISTRY_NIGHTLY }}/${{ github.repository }}:nightly

  tag-and-release:
    permissions:
      contents: write # for ncipollo/release-action to create release
    uses: ./.github/workflows/auto-release.yml
    needs: [build-container]
    with:
      image: ${{ vars.REGISTRY_NIGHTLY }}/${{ github.repository }}:nightly
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  # Prevent accidental deletion by not using dynamic Action variables
  housekeep-nightly-containers:
    permissions:
      packages: write
    needs: [scan-nightly-build]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/delete-package-versions@v5
        with:
          owner: 'jimsihk'
          package-name: 'alpine-php-nginx'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0

  retry-pr:
    permissions:
      contents: read
      actions: write
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Retry opened renovate PR which has been failed
        id: retry_renovate_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OPEN_RENOVATE_PR_BRANCHES="$(gh pr list --state "open" --json headRefName --jq '.[] | select(.headRefName|test("${{ env.RETRY_PR_BRANCH_PREFIX }}/.")) | .headRefName')"
          if [ -z "$OPEN_RENOVATE_PR_BRANCHES" ]; then
            OPEN_RENOVATE_PR_COUNT=0
          else
            OPEN_RENOVATE_PR_COUNT="$(printf "%s\n" "$OPEN_RENOVATE_PR_BRANCHES" | wc -l | tr -d " ")"
          fi
          RETRIED_RUN_COUNT=0

          if [ "$OPEN_RENOVATE_PR_COUNT" -eq 0 ]; then
            echo "No opened renovate PR found."
          else
            for PR_BRANCH in $OPEN_RENOVATE_PR_BRANCHES; do
              WORKFLOW_ID="$(gh run list --event pull_request --status failure --workflow "Build and test PR" --branch "$PR_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [ -n "$WORKFLOW_ID" ]; then
                echo "Retrying failed 'Build and test PR' run (${WORKFLOW_ID}) for branch ${PR_BRANCH}"
                gh run rerun "$WORKFLOW_ID"
                RETRIED_RUN_COUNT=$((RETRIED_RUN_COUNT + 1))
              else
                echo "No failed 'Build and test PR' run to retry for ${PR_BRANCH}"
              fi
            done
          fi

          echo "open_renovate_pr_count=${OPEN_RENOVATE_PR_COUNT}" >> "$GITHUB_OUTPUT"
          echo "retried_run_count=${RETRIED_RUN_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Find Renovate Dependency Dashboard issue
        id: find_renovate_dashboard
        if: ${{ always() && (steps.retry_renovate_pr.outputs.open_renovate_pr_count != '0' || steps.retry_renovate_pr.outputs.retried_run_count != '0') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DASHBOARD_ISSUE_NUMBER="$(gh issue list --state open --search "Dependency Dashboard in:title" --limit 1000 --json number --jq '.[0].number // empty' || true)"
          if [ -z "${DASHBOARD_ISSUE_NUMBER}" ]; then
            echo "No open Renovate Dependency Dashboard issue found."
          else
            echo "Found open Renovate Dependency Dashboard issue: #${DASHBOARD_ISSUE_NUMBER}"
          fi
          echo "dashboard_issue_number=${DASHBOARD_ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Trigger Renovate via Dependency Dashboard checkbox
        if: ${{ always() && (steps.retry_renovate_pr.outputs.open_renovate_pr_count != '0' || steps.retry_renovate_pr.outputs.retried_run_count != '0') && steps.find_renovate_dashboard.outputs.dashboard_issue_number != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: Jolg42/action-renovate-checkbox@v1
        with:
          master-issue-id: ${{ steps.find_renovate_dashboard.outputs.dashboard_issue_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry-pr summary
        if: always()
        run: |
          echo "Opened renovate PR count: ${{ steps.retry_renovate_pr.outputs.open_renovate_pr_count }}"
          echo "Retried failed workflow runs: ${{ steps.retry_renovate_pr.outputs.retried_run_count }}"
          if [ "${{ steps.retry_renovate_pr.outputs.open_renovate_pr_count }}" -eq 0 ] && [ "${{ steps.retry_renovate_pr.outputs.retried_run_count }}" -eq 0 ]; then
            echo "Skipped Renovate trigger: no open renovate PR."
          elif [ "${{ steps.find_renovate_dashboard.outputs.dashboard_issue_number }}" = "" ]; then
            echo "Skipped Renovate trigger: no open Renovate Dependency Dashboard issue found."
          else
            echo "Renovate trigger attempted for dashboard issue #${{ steps.find_renovate_dashboard.outputs.dashboard_issue_number }}."
          fi
